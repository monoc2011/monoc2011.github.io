<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カスタマーサポート | モノック株式会社</title>
<meta name="description" content="モノック株式会社のカスタマーサポート窓口です。">
<link rel="icon" href="../favicon.png" type="image/png">
<style>
:root{--lav:#7C6CF0;--ink:#251E2F;--bg:#F6F3EF;--white:#FFFFFF;--muted:#7A7382;--line:#E7E1DA;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:var(--bg);line-height:1.85;}
.en{font-family:"Helvetica Neue",Arial,sans-serif;}
.container{max-width:760px;margin:0 auto;padding:0 28px;}
nav{position:sticky;top:0;background:rgba(246,243,239,.92);backdrop-filter:blur(10px);z-index:10;border-bottom:1px solid var(--line);}
.nav-in{display:flex;align-items:center;justify-content:space-between;padding:16px 0;}
.logo{font-weight:800;font-size:19px;letter-spacing:.14em;color:var(--ink);text-decoration:none;}
.back{font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;letter-spacing:.08em;}
.back:hover{color:var(--lav);}
.kicker{display:flex;align-items:center;gap:9px;font-size:11.5px;font-weight:800;letter-spacing:.22em;color:var(--ink);margin-top:70px;}
.kicker::before{content:"";width:10px;height:10px;background:var(--lav);}
h1{font-size:34px;font-weight:800;margin-top:16px;letter-spacing:.01em;}
.lead{font-size:13.5px;color:var(--muted);margin-top:14px;}
.ec-note{margin-top:26px;background:var(--ink);color:#fff;border-radius:14px;padding:20px 24px;font-size:14.5px;font-weight:800;line-height:1.9;border-left:6px solid var(--lav);}
form{margin:40px 0 90px;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:36px;}
label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:22px 0 8px;}
label:first-child{margin-top:0;}
input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#FBF9F6;font:inherit;font-size:14px;padding:12px 14px;}
input:focus,textarea:focus{outline:none;border-color:var(--lav);box-shadow:0 0 0 3px rgba(124,108,240,.15);background:#fff;}
textarea{min-height:150px;resize:vertical;}
input[type=file]{padding:10px;font-size:12.5px;}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:700;padding:14px 34px;border-radius:999px;letter-spacing:.05em;background:var(--lav);color:#fff;margin-top:28px;transition:transform .25s,box-shadow .25s;}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(124,108,240,.4);}
footer{border-top:1px solid var(--line);padding:26px 0;font-size:11px;color:var(--muted);letter-spacing:.06em;}
.foot-in{display:flex;justify-content:space-between;}
</style>
</head>
<body>
<nav><div class="container nav-in">
  <a class="logo en" href="/">MONOC</a>
  <a class="back" href="/">← モノック株式会社 トップへ</a>
</div></nav>
<div class="container">
  <div class="kicker en">CUSTOMER SUPPORT</div>
  <h1>カスタマーサポート</h1>
  <p class="lead">モノックが取り扱うブランドの商品について、ご購入をご検討のお客様・ご購入いただいたお客様の窓口です。</p>
  <p class="ec-note">※ ECサイト・モールでご購入のお客様は当フォームからはご対応出来かねます。各サイト・モールにお問い合わせください。</p>
  <form name="support" method="POST" action="https://formspree.io/f/xnpapawd" enctype="multipart/form-data">
    <input type="hidden" name="_subject" value="【カスタマーサポート】monoc.inc">
    <input type="text" name="_gotcha" style="display:none">
    <label>ブランド</label><input type="text" name="ブランド" required>
    <label>購入日</label><input type="date" name="購入日">
    <label>購入場所(店舗名など)</label><input type="text" name="購入場所" required>
    <label>お名前</label><input type="text" name="お名前" required>
    <label>メールアドレス</label><input type="email" name="email" required>
    <label>内容</label><textarea name="内容" required></textarea>
    <label>添付(任意)</label><input type="file" name="添付" accept=".pdf,.jpg,.jpeg,.png,.heic">
    <button class="btn" type="submit">送信する</button>
  </form>
</div>
<footer><div class="container foot-in"><span>© MONOC Inc.</span><span class="en">EMPOWER THE MAKER.</span></div></footer>
<script>
document.querySelector('form').addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target,btn=f.querySelector('.btn');btn.disabled=true;btn.style.opacity='.6';
  fetch(f.action,{method:'POST',body:new FormData(f),headers:{'Accept':'application/json'}})
    .then(function(r){if(r.ok){window.location.href='/thanks.html';}else{throw new Error();}})
    .catch(function(){btn.disabled=false;btn.style.opacity='';
      var n=f.querySelector('.errmsg');
      if(!n){n=document.createElement('p');n.className='errmsg';n.style.cssText='margin-top:14px;font-size:12.5px;font-weight:700;color:#C0392B;';f.appendChild(n);}
      n.textContent='送信に失敗しました。時間をおいて、再度お試しください。';});
});
</script>
</body>
</html>
